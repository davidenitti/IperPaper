function capHighlightRect(rect,element){const fontSize=parseFloat(getComputedStyle(element).fontSize)||0,maxHeight=fontSize?Math.max(12,fontSize*1.35):0;if(!maxHeight||rect.height<=maxHeight)return rect;return {left:rect.left,top:rect.top,right:rect.right,bottom:rect.top+maxHeight,width:rect.width,height:maxHeight};}
function pdfHighlightRects(model,start,end){const rects=[];for(const segment of model.segments){const from=Math.max(start,segment.start),to=Math.min(end,segment.end);if(from>=to)continue;const range=document.createRange();range.setStart(segment.node,from-segment.start);range.setEnd(segment.node,to-segment.start);for(const rect of range.getClientRects())rects.push(capHighlightRect(rect,segment.node.parentElement));}return mergedRangeRects(rects);}
function pdfBlockFormulaRect(rects){if(!rects.length)return null;const left=Math.min(...rects.map(rect=>rect.left)),top=Math.min(...rects.map(rect=>rect.top)),right=Math.max(...rects.map(rect=>rect.right)),bottom=Math.max(...rects.map(rect=>rect.bottom));return {left,top,right,bottom,width:right-left,height:bottom-top};}
function addPdfHighlightRect(layer,rect,shellRect){const el=document.createElement('div');el.className='user-highlight';el.style.left=rect.left-shellRect.left+'px';el.style.top=rect.top-shellRect.top+'px';el.style.width=rect.width+2+'px';el.style.height=rect.height+'px';layer.appendChild(el);}
function normalizePdfHighlightText(value){return value.replace(/\s+/g,' ').trim();}
function pdfTextPattern(value){return value.trim().split(/\s+/).filter(Boolean).map(part=>part.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+');}
function storedHighlightRange(text,item){const pattern=pdfTextPattern(item.exact||'');if(!pattern)return null;const prefix=normalizePdfHighlightText(item.prefix||''),suffix=normalizePdfHighlightText(item.suffix||''),expectedStart=Number.isFinite(item.start)?item.start:0;let best=null;for(const match of text.matchAll(new RegExp(pattern,'g'))){const start=match.index??-1,end=start+match[0].length;if(start<0)continue;let score=start===expectedStart?4:0;if(prefix&&normalizePdfHighlightText(text.slice(0,start)).endsWith(prefix))score++;if(suffix&&normalizePdfHighlightText(text.slice(end)).startsWith(suffix))score++;const distance=Math.abs(start-expectedStart);if(!best||score>best.score||(score===best.score&&distance<best.distance))best={start,end,score,distance};}return best?{start:best.start,end:best.end}:null;}
function equivalentPdfHighlight(saved,item){const sameLocation=Number.isFinite(saved.start)&&Number.isFinite(item.start)&&saved.start===item.start;return saved.page===item.page&&(saved.kind||'sentence')===(item.kind||'sentence')&&normalizePdfHighlightText(saved.exact||'')===normalizePdfHighlightText(item.exact||'')&&(sameLocation||(normalizePdfHighlightText(saved.prefix||'')===normalizePdfHighlightText(item.prefix||'')&&normalizePdfHighlightText(saved.suffix||'')===normalizePdfHighlightText(item.suffix||'')));}
function pdfHighlightAt(model,page,offset){for(const item of userHighlights){if(item.page!==page)continue;const range=storedHighlightRange(model.text,item);if(range&&offset>=range.start&&offset<=range.end)return item;}return null;}
function repairPdfHighlight(item,model,shell){const range=storedHighlightRange(model.text,item),segment=range&&model.segments.find(candidate=>range.start<candidate.end&&range.end>candidate.start);if(!segment)return false;const bounds=item.kind==='equation'?pdfEquationBounds(model,segment.node,shell):pdfProseBounds(model,pdfSentenceBounds(model.text,range.start),segment.node,shell);if(!bounds||bounds.end<=bounds.start||(bounds.start===range.start&&bounds.end===range.end))return false;item.start=bounds.start;item.end=bounds.end;item.exact=model.text.slice(bounds.start,bounds.end);item.prefix=model.text.slice(Math.max(0,bounds.start-32),bounds.start);item.suffix=model.text.slice(bounds.end,bounds.end+32);return true;}
function renderPdfHighlights(shell){const layer=shell.querySelector('.user-highlight-layer');if(!layer)return;layer.replaceChildren();const model=pdfTextModel(shell),page=Number(shell.dataset.pageNumber),shellRect=shell.getBoundingClientRect();let repaired=false;for(const item of userHighlights){if(item.page!==page)continue;repaired=repairPdfHighlight(item,model,shell)||repaired;const range=storedHighlightRange(model.text,item);if(!range)continue;const rects=pdfHighlightRects(model,range.start,range.end);if(item.kind==='equation'){const blockRect=pdfBlockFormulaRect(rects);if(blockRect)addPdfHighlightRect(layer,blockRect,shellRect);continue;}for(const rect of rects)addPdfHighlightRect(layer,rect,shellRect);}if(repaired)saveUserHighlights();}
function togglePdfHighlight(item){const matches=userHighlights.filter(saved=>equivalentPdfHighlight(saved,item));if(matches.length)userHighlights=userHighlights.filter(saved=>!matches.includes(saved));else userHighlights.push(item);saveUserHighlights();for(const shell of document.querySelectorAll(`.page-shell[data-page-number="${item.page}"]`))if(shell.dataset.rendered==='1')renderPdfHighlights(shell);}
function clearTextSelection(){getSelection()?.removeAllRanges();}
function pdfHighlightContextMenu(event){if(event.target.closest('.ip-header,.detail-panel,.tooltip,.annotationLayer,.annotation-layer,a,button,summary,[role="button"]'))return;const shell=event.target.closest('.page-shell');if(!shell||shell.dataset.rendered!=='1')return;const caret=caretAtPoint(event.clientX,event.clientY);if(!caret||!shell.querySelector('.textLayer').contains(caret.node))return;const model=pdfTextModel(shell),offset=pdfPoint(model,caret.node,caret.offset),page=Number(shell.dataset.pageNumber);if(offset===null)return;const existing=pdfHighlightAt(model,page,offset);if(existing){event.preventDefault();togglePdfHighlight(existing);clearTextSelection();return;}const equation=pdfEquationBounds(model,caret.node,shell),bounds=equation||pdfProseBounds(model,pdfSentenceBounds(model.text,offset),caret.node,shell);if(bounds.end<=bounds.start)return;event.preventDefault();togglePdfHighlight({kind:equation?'equation':'sentence',page,start:bounds.start,end:bounds.end,exact:model.text.slice(bounds.start,bounds.end),prefix:model.text.slice(Math.max(0,bounds.start-32),bounds.start),suffix:model.text.slice(bounds.end,bounds.end+32)});clearTextSelection();}
function isReferenceTarget(id){return id.startsWith('eqref_')||id.startsWith('figref_')||id.startsWith('tabref_')||id.startsWith('bibref_');}
function underlyingPdfLink(el,event){for(const node of document.elementsFromPoint(event.clientX,event.clientY)){const link=node.closest?.('.annotationLayer a');if(link)return link;}const targetRect=el.getBoundingClientRect(),shell=el.closest('.page-shell');if(!shell)return null;for(const link of shell.querySelectorAll('.annotationLayer a')){const r=link.getBoundingClientRect();if(r.right>targetRect.left&&r.left<targetRect.right&&r.bottom>targetRect.top&&r.top<targetRect.bottom)return link;}return null;}
function addTargets(layer,pageNumber){for(const target of targetsByPage.get(pageNumber)||[]){const a=byId.get(target.id);if(!a)continue;const el=document.createElement('button');el.type='button';el.className='ip-target';el.setAttribute('aria-label',a.label+': '+a.short);el.style.left=(target.x*100)+'%';el.style.top=(target.y*100)+'%';el.style.width=(target.width*100)+'%';el.style.height=(target.height*100)+'%';el.addEventListener('mousemove',e=>showTooltip(a,e.clientX,e.clientY));el.addEventListener('mouseleave',hideTooltip);el.addEventListener('focus',()=>{const r=el.getBoundingClientRect();showTooltip(a,r.left,r.bottom);});el.addEventListener('blur',hideTooltip);el.addEventListener('click',e=>{if(a.external_url){hideTooltip();window.open(a.external_url,'_blank','noopener,noreferrer');return;}if(isReferenceTarget(target.id)){const link=underlyingPdfLink(el,e);if(link){hideTooltip();link.click();return;}}renderDetail(a);hideTooltip();});layer.appendChild(el);}}

function decodePdf(){const binary=atob(PDF_BASE64);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;}
function currentPageNumber(){const slices=[...document.querySelectorAll('.page-slice'),...document.querySelectorAll('.page-shell')].filter(el=>el.offsetParent!==null&&(!el.classList.contains('page-shell')||!el.closest('.page-slice')));const marker=window.scrollY+64;let best=1,bestDistance=Infinity;for(const slice of slices){const top=slice.getBoundingClientRect().top+window.scrollY;const distance=Math.abs(top-marker);if(distance<bestDistance){bestDistance=distance;best=Number(slice.dataset.pageNumber);}}return best;}
function pointValue(point){return (point.page-1)+point.y;}
function comparePoints(a,b){return pointValue(a)-pointValue(b);}
function openAncestors(element){for(let node=element.parentElement;node;node=node.parentElement){if(node.matches?.('details.level-accordion'))node.open=true;}}
function revealPdfDestination(pageNumber,y=0){const candidates=[...document.querySelectorAll(`.page-slice[data-page-number="${pageNumber}"]`)];const target=candidates.find(slice=>y>=Number(slice.dataset.yStart)-.0001&&y<=Number(slice.dataset.yEnd)+.0001)||candidates[0]||document.querySelector(`.page-shell[data-page-number="${pageNumber}"]`);if(!target)return;openAncestors(target);requestAnimationFrame(()=>{const shell=target.classList.contains('page-shell')?target:target.querySelector(':scope > .page-shell');if(!shell)return;const rect=shell.getBoundingClientRect(),header=document.querySelector('.ip-header'),offset=(header?.getBoundingClientRect().height||0)+8;window.scrollTo({top:Math.max(0,window.scrollY+rect.top+y*rect.height-offset),behavior:'smooth'});});}

class IperPaperLinkService{
  constructor(){this.eventBus=null;this.externalLinkEnabled=true;this.externalLinkTarget=2;this.externalLinkRel='noopener noreferrer nofollow';}
  get isInPresentationMode(){return false;}
  addLinkAttributes(link,url,newWindow=false){if(!url||typeof url!=='string')return;link.href=url;link.target=(newWindow||this.externalLinkTarget===2)?'_blank':'';link.rel=this.externalLinkRel;}
  getAnchorUrl(anchor){return anchor||'#';}
  getDestinationHash(){return '#';}
  async goToDestination(dest){let explicit=typeof dest==='string'?await pdfDocument.getDestination(dest):dest;if(!Array.isArray(explicit))return;const ref=explicit[0];let pageNumber=null;if(Number.isInteger(ref))pageNumber=ref+1;else if(ref&&typeof ref==='object'){try{pageNumber=(await pdfDocument.getPageIndex(ref))+1;}catch(_){}}if(!pageNumber)return;const rawTop=typeof explicit[3]==='number'?explicit[3]:PAGE_SIZES[pageNumber-1].height;const y=Math.max(0,Math.min(1,(PAGE_SIZES[pageNumber-1].height-rawTop)/PAGE_SIZES[pageNumber-1].height));revealPdfDestination(pageNumber,y);}
  executeNamedAction(action){const current=currentPageNumber();const last=PAGE_SIZES.length;const destinations={FirstPage:1,LastPage:last,NextPage:Math.min(last,current+1),PrevPage:Math.max(1,current-1)};const pageNumber=destinations[action];if(pageNumber)revealPdfDestination(pageNumber);}
  executeSetOCGState(){}
  async getAttachmentContent(id){try{return await pdfDocument.getAttachmentContent(id);}catch(_){return null;}}
}
const linkService=new IperPaperLinkService();

async function renderPage(shell){
  if(!pdfDocument)return;
  const pageNumber=Number(shell.dataset.pageNumber),width=shell.clientWidth;
  if(width<1)return;
  let state=pageStates.get(shell);
  if(!state){state={page:null,renderTask:null,textLayer:null,annotationLayer:null,generation:0,width:0};pageStates.set(shell,state);}
  if(Math.abs(state.width-width)<0.75&&shell.dataset.rendered==='1')return;
  if(state.renderTask){try{state.renderTask.cancel();}catch(_){}}
  state.textLayer?.cancel?.();
  const generation=++state.generation;
  const page=state.page||(state.page=await pdfDocument.getPage(pageNumber));
  if(generation!==state.generation)return;
  const baseViewport=page.getViewport({scale:1});
  const viewport=page.getViewport({scale:width/baseViewport.width});
  shell.style.setProperty('--total-scale-factor',String(viewport.scale));
  shell.style.setProperty('--scale-round-x','1px');shell.style.setProperty('--scale-round-y','1px');
  const outputScale=Math.min(window.devicePixelRatio||1,3),canvas=shell.querySelector('canvas');
  canvas.width=Math.max(1,Math.ceil(viewport.width*outputScale));canvas.height=Math.max(1,Math.ceil(viewport.height*outputScale));canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';
  const context=canvas.getContext('2d',{alpha:false});const transform=outputScale===1?null:[outputScale,0,0,outputScale,0,0];
  try{
    state.renderTask=page.render({canvasContext:context,viewport,transform});await state.renderTask.promise;if(generation!==state.generation)return;
    const textLayerDiv=shell.querySelector('.textLayer');textLayerDiv.replaceChildren();state.textLayer=new pdfjsLib.TextLayer({textContentSource:page.streamTextContent({includeMarkedContent:true}),container:textLayerDiv,viewport});await state.textLayer.render();if(generation!==state.generation)return;renderPdfHighlights(shell);
    const annotationLayerDiv=shell.querySelector('.annotationLayer');annotationLayerDiv.replaceChildren();const nativeAnnotations=(await page.getAnnotations({intent:'display'})).filter(annotation=>{const url=annotation?.url||annotation?.unsafeUrl||'',destination=annotation?.dest||'';return !(typeof url==='string'&&url.startsWith('iperpaper:'))&&!(typeof destination==='string'&&destination.startsWith('iperpaper-level-'));});
    state.annotationLayer=new pdfjsLib.AnnotationLayer({div:annotationLayerDiv,page,viewport:viewport.clone({dontFlip:true}),linkService,annotationStorage:pdfDocument.annotationStorage,annotationCanvasMap:new Map()});
    await state.annotationLayer.render({annotations:nativeAnnotations,renderForms:false,enableScripting:false,hasJSActions:false,fieldObjects:null,optionalContentConfig:await pdfDocument.getOptionalContentConfig({intent:'display'})});
    if(generation===state.generation){state.width=width;shell.dataset.rendered='1';}
  }catch(error){if(error?.name!=='RenderingCancelledException'&&error?.name!=='AbortException')throw error;}finally{if(generation===state.generation)state.renderTask=null;}
}

function createPageShell(size,pageNumber){const shell=document.createElement('section');shell.className='page-shell';shell.dataset.pageNumber=String(pageNumber);shell.style.aspectRatio=size.width+' / '+size.height;shell.setAttribute('aria-label','Page '+pageNumber);const canvas=document.createElement('canvas');canvas.className='page-canvas';canvas.setAttribute('aria-label','Rendered PDF page '+pageNumber);shell.appendChild(canvas);const textLayer=document.createElement('div');textLayer.className='textLayer';shell.appendChild(textLayer);const highlightLayer=document.createElement('div');highlightLayer.className='user-highlight-layer';highlightLayer.setAttribute('aria-hidden','true');shell.appendChild(highlightLayer);const nativeAnnotationLayer=document.createElement('div');nativeAnnotationLayer.className='annotationLayer';shell.appendChild(nativeAnnotationLayer);const layer=document.createElement('div');layer.className='annotation-layer';addTargets(layer,pageNumber);shell.appendChild(layer);return shell;}
function observeShell(shell){visibilityObserver.observe(shell);resizeObserver.observe(shell);}
function createPageSlice(pageNumber,yStart,yEnd){const size=PAGE_SIZES[pageNumber-1],span=Math.max(0,yEnd-yStart),slice=document.createElement('div');slice.className='page-slice';if(yEnd>=.999999)slice.classList.add('page-end');slice.dataset.pageNumber=String(pageNumber);slice.dataset.yStart=String(yStart);slice.dataset.yEnd=String(yEnd);slice.style.aspectRatio=size.width+' / '+(size.height*span);const shell=createPageShell(size,pageNumber);shell.style.top=(-100*yStart/span)+'%';slice.appendChild(shell);observeShell(shell);return slice;}
function appendPdfRange(parent,start,end){if(comparePoints(start,end)>=-.000001)return;for(let page=start.page;page<=end.page;page++){const yStart=page===start.page?start.y:0,yEnd=page===end.page?end.y:1;if(yEnd-yStart>.000001)parent.appendChild(createPageSlice(page,yStart,yEnd));}}
function sectionHeadingRange(section){if(section.title){const topPad=.0045,bottomTrim=.002,start=Math.max(0,section.title.y-topPad),end=Math.min(1,section.title.y+section.title.height-bottomTrim);return {start:{page:section.title.page,y:start},end:{page:section.title.page,y:end}};}const end={page:section.content.page,y:Math.max(0,section.content.y-.011)};let start;if(section.start.page===end.page){start={page:end.page,y:Math.min(end.y,section.start.y+.002)};}else{start={page:end.page,y:Math.max(0,end.y-.05)};}if(comparePoints(start,end)>=-.012)start={page:end.page,y:Math.max(0,end.y-.035)};return {start,end};}
function levelSectionsInOrder(){return [...LEVEL_SECTIONS].sort((a,b)=>comparePoints(a.start,b.start));}
function createLevelAccordion(section){const heading=sectionHeadingRange(section),details=document.createElement('details');details.className='level-accordion level-2';details.dataset.levelId=section.id;const summary=document.createElement('summary');summary.setAttribute('aria-label','Level 2 section; expand');appendPdfRange(summary,heading.start,heading.end);const body=document.createElement('div');body.className='level-body';appendPdfRange(body,heading.end,section.end);details.append(summary,body);summary.addEventListener('click',event=>{event.preventDefault();details.open=!details.open;});details.addEventListener('toggle',()=>{summary.setAttribute('aria-label','Level 2 section; '+(details.open?'collapse':'expand'));if(details.open)for(const shell of body.querySelectorAll('.page-shell'))renderPage(shell).catch(showError);});return details;}
function appendStructuredRange(parent,start,end,sections){let cursor=start;for(const section of sections){const heading=sectionHeadingRange(section);appendPdfRange(parent,cursor,heading.start);parent.appendChild(createLevelAccordion(section));cursor=section.end;}appendPdfRange(parent,cursor,end);}
function setupObservers(){visibilityObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting)renderPage(entry.target).catch(showError);}},{rootMargin:'1400px 0px'});resizeObserver=new ResizeObserver(entries=>{for(const entry of entries){const shell=entry.target;if(shell.dataset.rendered==='1')renderPage(shell).catch(showError);}});}
function buildPages(){const viewer=document.getElementById('viewer');viewer.innerHTML='';setupObservers();if(LEVEL_SECTIONS.length){viewer.classList.add('structured');appendStructuredRange(viewer,{page:1,y:0},{page:PAGE_SIZES.length,y:1},levelSectionsInOrder());return;}for(let i=0;i<PAGE_SIZES.length;i++){const shell=createPageShell(PAGE_SIZES[i],i+1);viewer.appendChild(shell);observeShell(shell);}}
function showError(error){console.error(error);const viewer=document.getElementById('viewer');viewer.innerHTML='';const box=document.createElement('div');box.className='error';box.textContent='Could not render the PDF reader: '+(error?.message||String(error));viewer.appendChild(box);}
async function start(){pdfjsLib=await import(PDFJS_MODULE_URL);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER_URL;pdfDocument=await pdfjsLib.getDocument({data:decodePdf(),wasmUrl:PDFJS_WASM_URL,cMapUrl:PDFJS_CMAP_URL,cMapPacked:true,standardFontDataUrl:PDFJS_STANDARD_FONT_URL}).promise;if(pdfDocument.numPages!==PAGE_SIZES.length)throw new Error('PDF page count does not match the annotation geometry.');buildPages();}

document.getElementById('close-detail').addEventListener('click',()=>document.getElementById('detail').classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('detail').classList.remove('open');});
const layoutToggle=document.getElementById('layout-toggle');
function rerenderAllPages(){for(const shell of document.querySelectorAll('.page-shell')){if(shell.dataset.rendered==='1'){shell.dataset.rendered='0';renderPage(shell).catch(showError);}}}
function applyLayout(mode){const side=mode==='side';document.body.classList.toggle('side-mode',side);layoutToggle.setAttribute('aria-pressed',side?'true':'false');const rootStyle=document.documentElement.style;if(side){rootStyle.setProperty('--ip-shift-factor',(-2*TEXT_MARGINS.left/3).toFixed(6));rootStyle.setProperty('--ip-panel-factor',(TEXT_MARGINS.right-2*TEXT_MARGINS.left/3).toFixed(6));}else{rootStyle.removeProperty('--ip-shift-factor');rootStyle.removeProperty('--ip-panel-factor');}rerenderAllPages();try{localStorage.setItem('iperpaper-layout',mode);}catch(_){}}
layoutToggle.addEventListener('click',()=>applyLayout(document.body.classList.contains('side-mode')?'default':'side'));
try{if(localStorage.getItem('iperpaper-layout')==='side')applyLayout('side');}catch(_){}
const askBox=document.getElementById('ask-ai');
function askPromptText(){const selection=getSelection(),text=selection?selection.toString().replace(/\s+/g,' ').trim():'';return text.length>2000?text.slice(0,2000)+'…':text;}
function askUrl(provider,text){const prompt='Explain this in detail for the paper "'+PAPER_TITLE+'":\n'+text;if(provider==='perplexity')return 'https://www.perplexity.ai/search?q='+encodeURIComponent(prompt);return 'https://chatgpt.com/?q='+encodeURIComponent(prompt);}
function hideAskBox(){askBox.style.display='none';}
document.addEventListener('selectionchange',()=>{const selection=getSelection();if(!selection||selection.isCollapsed){hideAskBox();return;}const text=selection.toString().trim();if(!text){hideAskBox();return;}const rect=selection.getRangeAt(0).getBoundingClientRect();if(!rect||(!rect.width&&!rect.height)){hideAskBox();return;}askBox.style.display='flex';const width=askBox.offsetWidth||150,height=askBox.offsetHeight||76;askBox.style.left=Math.max(8,Math.min(rect.left,innerWidth-width-8))+'px';askBox.style.top=Math.max(8,rect.top-height-8>8?rect.top-height-8:rect.bottom+8)+'px';});
for(const button of askBox.querySelectorAll('button')){button.addEventListener('mousedown',e=>e.preventDefault());button.addEventListener('click',e=>{e.stopPropagation();const text=askPromptText();hideAskBox();if(!text)return;window.open(askUrl(e.currentTarget.dataset.provider,text),'_blank','noopener');});}
document.addEventListener('mousedown',e=>{if(!askBox.contains(e.target))hideAskBox();});
window.addEventListener('scroll',hideAskBox,{passive:true});
document.addEventListener('contextmenu',pdfHighlightContextMenu);
start().catch(showError);
</script>
