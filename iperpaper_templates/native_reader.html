function nativeHighlightContextMenu(event){if(event.target.closest('.ip-header,.detail-panel,.tooltip,a,button,summary,[role="button"],.ip-target'))return;const equation=event.target.closest('.math.display');if(equation){const equations=[...document.querySelectorAll('.math.display')],index=equations.indexOf(equation);if(index>=0){event.preventDefault();toggleNativeHighlight({kind:'equation',equation:index,exact:equation.dataset.ipHighlightText||equation.textContent||''});clearTextSelection();}return;}const block=event.target.closest(HIGHLIGHT_BLOCK_SELECTOR);if(!block)return;const caret=caretAtPoint(event.clientX,event.clientY);if(!caret)return;const model=nativeTextModel(block),offset=nativePoint(model,caret.node,caret.offset);if(offset===null)return;const blocks=[...document.querySelectorAll(HIGHLIGHT_BLOCK_SELECTOR)],blockIndex=blocks.indexOf(block),existing=nativeHighlightAt(model,blockIndex,offset);if(existing){event.preventDefault();toggleNativeHighlight(existing);clearTextSelection();return;}const bounds=sentenceBounds(model.text,offset,model.sentenceText);if(bounds.end<=bounds.start)return;event.preventDefault();toggleNativeHighlight({kind:'sentence',block:blockIndex,start:bounds.start,end:bounds.end,exact:model.text.slice(bounds.start,bounds.end),prefix:model.text.slice(Math.max(0,bounds.start-32),bounds.start),suffix:model.text.slice(bounds.end,bounds.end+32)});clearTextSelection();}
function activate(el,id){if(el.dataset.ipReady)return;const a=byId.get(id);if(!a)return;el.dataset.ipReady='1';el.dataset.annotationId=id;el.classList.add('ip-target');el.setAttribute('aria-label',a.label+': '+a.short);if(!el.matches('a')){el.setAttribute('role','button');el.tabIndex=0;}el.addEventListener('mousemove',e=>showTooltip(a,e.clientX,e.clientY));el.addEventListener('mouseleave',hideTooltip);el.addEventListener('focus',()=>{const r=el.getBoundingClientRect();showTooltip(a,r.left,r.bottom);});el.addEventListener('blur',hideTooltip);const authored=el.matches('a[href^="iperpaper:"]')||!el.matches('a');el.addEventListener('click',e=>{if(a.external_url){e.preventDefault();hideTooltip();window.open(a.external_url,'_blank','noopener,noreferrer');return;}if(authored){e.preventDefault();renderDetail(a);hideTooltip();return;}const destination=el.getAttribute('href')||'';if(destination.startsWith('#eq:')&&!document.getElementById(destination.slice(1))){const mathTarget=document.getElementById('mjx-eqn:'+destination.slice(1));if(mathTarget){e.preventDefault();mathTarget.scrollIntoView({behavior:'smooth',block:'center'});}}});el.addEventListener('keydown',e=>{if(!el.matches('a')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();renderDetail(a);hideTooltip();}});}
function initializeLevelSections(){document.querySelectorAll('details.level-accordion.level-2').forEach(details=>{if(details.dataset.levelReady)return;details.dataset.levelReady='1';const summary=details.querySelector(':scope > summary');if(!summary)return;const title=summary.textContent.trim();const update=()=>summary.setAttribute('aria-label',(details.open?'Collapse':'Expand')+' Level 2 section: '+title);details.addEventListener('toggle',update);update();});}
function initializeTargets(){document.querySelectorAll('[data-annotation-id]').forEach(el=>activate(el,el.dataset.annotationId));document.querySelectorAll('a[href^="iperpaper:"]').forEach(el=>activate(el,el.getAttribute('href').slice('iperpaper:'.length)));for(const [className,id] of Object.entries(MATH_TARGET_CLASSES))document.querySelectorAll('.'+className).forEach(el=>activate(el,id));}
document.getElementById('close-detail').addEventListener('click',()=>document.getElementById('detail').classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('detail').classList.remove('open');});
const layoutToggle=document.getElementById('layout-toggle');
function applyLayout(mode){const side=mode==='side';document.body.classList.toggle('side-mode',side);layoutToggle.setAttribute('aria-pressed',side?'true':'false');try{localStorage.setItem('iperpaper-layout',mode);}catch(_){}requestAnimationFrame(renderNativeHighlights);}
layoutToggle.addEventListener('click',()=>applyLayout(document.body.classList.contains('side-mode')?'default':'side'));
try{if(localStorage.getItem('iperpaper-layout')==='side')applyLayout('side');}catch(_){}
const askBox=document.getElementById('ask-ai');
function askPromptText(){const selection=getSelection(),text=selection?selection.toString().replace(/\s+/g,' ').trim():'';return text.length>2000?text.slice(0,2000)+'…':text;}
function askUrl(provider,text){const prompt='Explain this in detail for the paper "'+PAPER_TITLE+'":\n'+text;if(provider==='perplexity')return 'https://www.perplexity.ai/search?q='+encodeURIComponent(prompt);return 'https://chatgpt.com/?q='+encodeURIComponent(prompt);}
function hideAskBox(){askBox.style.display='none';}
document.addEventListener('selectionchange',()=>{const selection=getSelection();if(!selection||selection.isCollapsed){hideAskBox();return;}const text=selection.toString().trim();if(!text){hideAskBox();return;}const rect=selection.getRangeAt(0).getBoundingClientRect();if(!rect||(!rect.width&&!rect.height)){hideAskBox();return;}askBox.style.display='flex';const width=askBox.offsetWidth||150,height=askBox.offsetHeight||76;askBox.style.left=Math.max(8,Math.min(rect.left,innerWidth-width-8))+'px';askBox.style.top=Math.max(8,rect.top-height-8>8?rect.top-height-8:rect.bottom+8)+'px';});
for(const button of askBox.querySelectorAll('button')){button.addEventListener('mousedown',e=>e.preventDefault());button.addEventListener('click',e=>{e.stopPropagation();const text=askPromptText();hideAskBox();if(!text)return;window.open(askUrl(e.currentTarget.dataset.provider,text),'_blank','noopener');});}
document.addEventListener('mousedown',e=>{if(!askBox.contains(e.target))hideAskBox();});
window.addEventListener('scroll',hideAskBox,{passive:true});
document.addEventListener('contextmenu',nativeHighlightContextMenu);
window.addEventListener('resize',renderNativeHighlights);
initializeHighlightSources();initializeLevelSections();initializeTargets();renderNativeHighlights();
window.addEventListener('load',()=>{initializeLevelSections();initializeTargets();renderNativeHighlights();window.MathJax?.startup?.promise?.then(()=>{initializeTargets();renderNativeHighlights();});});
</script>
</body></html>
